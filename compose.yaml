name: lecrocodile

services:
  reviews:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    ports: ["0.0.0.0:7443:7443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Path: /data/reviews.db
    volumes:
      - reviews-data:/data
      - reviews-backups:/backups

volumes:
  reviews-data:
  reviews-backups:
